<!doctype html>
<html lang="en">
<head>
  <!-- PAGE MAP: styles in head; login and score tools in main; API calls at bottom. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e7039">
  <title>Leaderboard Admin | Vardes Tower Defense</title>
  <style>
    :root {
      --grass: #1e7039;
      --deep: #174f2c;
      --leaf: #32834b;
      --paper: #f7f5ec;
      --ink: #173522;
      --muted: #627566;
      --danger: #a33c3c;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 38px 18px;
      color: var(--ink);
      background: var(--grass);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }
    .page { width: min(100%, 850px); margin: 0 auto; }
    .hero {
      padding: 24px 30px;
      color: white;
      background: linear-gradient(130deg, var(--deep), #286f3d);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 22px 22px 10px 10px;
      box-shadow: 0 12px 28px rgba(10,42,22,.22);
    }
    .game-name { margin: 0 0 7px; color: #d6f0d6; font-size: 13px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); }
    .hero p:last-child { margin: 8px 0 0; color: #e5f1e4; }
    .panel {
      margin-top: 18px;
      padding: 26px clamp(16px, 4vw, 32px) 30px;
      background: var(--paper);
      border-radius: 12px 12px 22px 22px;
      box-shadow: 0 18px 38px rgba(10,42,22,.2);
    }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
    h2 { margin: 0; font-size: 23px; }
    .subtle { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .login { width: min(100%, 430px); margin: 10px auto; }
    label { display: block; margin-bottom: 7px; font-weight: 700; }
    input {
      width: 100%;
      padding: 12px 14px;
      color: var(--ink);
      background: white;
      border: 1px solid #cbd7cb;
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
    }
    input:focus { outline: 3px solid rgba(112,148,190,.35); border-color: #7094be; }
    button, .back {
      min-height: 40px;
      padding: 10px 15px;
      color: white;
      background: var(--leaf);
      border: 0;
      border-radius: 9px;
      box-shadow: 0 3px 0 var(--deep);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }
    button:hover, .back:hover { filter: brightness(1.06); }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--deep); }
    .login button { width: 100%; margin-top: 13px; }
    .danger { background: var(--danger); box-shadow: 0 3px 0 #702a2a; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
    .toolbar .danger { box-shadow: 0 3px 0 #702a2a; }
    .back { display: inline-flex; align-items: center; }
    .status { min-height: 20px; margin: 13px 0 0; color: var(--muted); font-size: 14px; }
    .status.error { color: #9a3030; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 7px; text-align: left; }
    th { padding: 0 12px 5px; color: #718175; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    td { padding: 10px 12px; background: white; border-top: 1px solid #e5e9dc; border-bottom: 1px solid #e5e9dc; }
    td:first-child { border-left: 1px solid #e5e9dc; border-radius: 9px 0 0 9px; }
    td:last-child { border-right: 1px solid #e5e9dc; border-radius: 0 9px 9px 0; text-align: right; }
    td.score { color: var(--deep); font-variant-numeric: tabular-nums; font-weight: 800; }
    .remove { min-height: 32px; padding: 6px 10px; font-size: 13px; }
    .footer { padding: 17px 0 0; color: rgba(255,255,255,.8); font-size: 12px; text-align: center; }
    .footer a { color: inherit; text-underline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) {
      body { padding: 16px 10px; }
      .hero { padding: 21px 18px; }
      .panel { padding: 20px 13px 23px; }
      .panel-head { align-items: flex-start; flex-direction: column; }
      th, td { padding-right: 8px; padding-left: 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="game-name">Vardes Tower Defense</p>
      <h1>Leaderboard Admin</h1>
      <p>Manage saved player scores.</p>
    </header>

    <section class="panel">
      <form class="login" id="login-form">
        <label for="password">Admin password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Unlock admin</button>
      </form>

      <div id="admin-panel" hidden>
        <div class="panel-head">
          <div>
            <h2>Saved results</h2>
            <p class="subtle">Remove one result or clear the leaderboard.</p>
          </div>
          <div class="toolbar">
            <button class="danger" id="delete-all" type="button">Delete all scores</button>
            <button id="logout" type="button">Log out</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Username</th><th>Score</th><th>Action</th></tr></thead>
            <tbody id="score-rows"></tbody>
          </table>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
    <footer class="footer"><a href="/">Back to leaderboard</a></footer>
  </main>

  <script>
    const loginForm = document.getElementById("login-form");
    const adminPanel = document.getElementById("admin-panel");
    const rows = document.getElementById("score-rows");
    const statusText = document.getElementById("status");

    // ADMIN FEEDBACK: show success and error messages below the panel.
    function setStatus(message, isError = false) {
      statusText.textContent = message;
      statusText.classList.toggle("error", isError);
    }

    // LOGIN VISIBILITY: switch between the password form and score tools.
    function showLoggedIn(isLoggedIn) {
      loginForm.hidden = isLoggedIn;
      adminPanel.hidden = !isLoggedIn;
    }

    // ADMIN SCORE LIST: fetch protected results and create one row per score.
    async function loadScores() {
      const response = await fetch("/admin/scores", { cache: "no-store" });
      if (response.status === 401) {
        showLoggedIn(false);
        return false;
      }
      if (!response.ok) throw new Error("Could not load saved results.");
      const scores = await response.json();
      rows.replaceChildren();

      if (scores.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 4;
        cell.textContent = "There are no saved scores.";
        row.append(cell);
        rows.append(row);
      } else {
        for (const score of scores) {
          const row = document.createElement("tr");
          for (const value of [score.id, score.username]) {
            const cell = document.createElement("td");
            cell.textContent = String(value);
            row.append(cell);
          }
          const points = document.createElement("td");
          points.className = "score";
          points.textContent = Number(score.score).toLocaleString();
          row.append(points);

          const action = document.createElement("td");
          const button = document.createElement("button");
          button.className = "danger remove";
          button.type = "button";
          button.textContent = "Remove";
          // ROW REMOVE BUTTON: ask before deleting this score by its database ID.
          button.addEventListener("click", () => removeOne(score));
          action.append(button);
          row.append(action);
          rows.append(row);
        }
      }
      showLoggedIn(true);
      return true;
    }

    // DELETE ONE SCORE: confirm the action, call the API, and refresh the list.
    async function removeOne(score) {
      if (!window.confirm(`Remove ${score.username}'s score of ${Number(score.score).toLocaleString()}?`)) return;
      const response = await fetch(`/admin/scores/${score.id}`, { method: "DELETE" });
      if (!response.ok) {
        setStatus("Could not remove that result. Please log in again if needed.", true);
        if (response.status === 401) showLoggedIn(false);
        return;
      }
      setStatus("Result removed.");
      await loadScores();
    }

    // ADMIN LOGIN BUTTON: verify the password and request the protected score list.
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");
      const password = document.getElementById("password").value;
      try {
        const response = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Login failed.");
        document.getElementById("password").value = "";
        setStatus("Admin access unlocked.");
        await loadScores();
      } catch (error) {
        setStatus(error.message || "Could not reach the server.", true);
      }
    });

    // DELETE ALL BUTTON: confirm and remove every saved score.
    document.getElementById("delete-all").addEventListener("click", async () => {
      if (!window.confirm("Delete every saved score? This cannot be undone.")) return;
      const response = await fetch("/admin/scores", { method: "DELETE" });
      if (!response.ok) {
        setStatus("Could not delete scores. Please log in again if needed.", true);
        if (response.status === 401) showLoggedIn(false);
        return;
      }
      const result = await response.json();
      setStatus(`${result.deleted} score${result.deleted === 1 ? "" : "s"} removed.`);
      await loadScores();
    });

    // LOGOUT BUTTON: end the admin session and return to the login form.
    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/admin/logout", { method: "POST" });
      showLoggedIn(false);
      setStatus("Logged out.");
    });

    // PAGE STARTUP: check whether an admin session already exists.
    loadScores().catch(() => setStatus("Could not reach the server.", true));
  </script>
</body>
</html>

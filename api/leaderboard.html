<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e7039">
  <title>Vardes Tower Defense | Leaderboard</title>
  <style>
    :root {
      color-scheme: light;
      --grass: #1e7039;
      --deep-grass: #174f2c;
      --leaf: #32834b;
      --road: #7094be;
      --ink: #173522;
      --muted: #627566;
      --paper: #f7f5ec;
      --white: #fffef9;
      --pink: #d84ca3;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 38px 18px;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 12%, rgba(255,255,255,.08) 0 3px, transparent 4px),
        radial-gradient(circle at 90% 82%, rgba(255,255,255,.07) 0 5px, transparent 6px),
        var(--grass);
      background-size: 54px 54px, 83px 83px, auto;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .page { width: min(100%, 850px); margin: 0 auto; }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 132px;
      padding: 24px 30px;
      overflow: hidden;
      color: white;
      background: linear-gradient(130deg, var(--deep-grass), #286f3d);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 24px 24px 12px 12px;
      box-shadow: 0 12px 28px rgba(10,42,22,.22);
    }

    .frog-mark {
      position: relative;
      z-index: 1;
      flex: 0 0 82px;
      width: 82px;
      height: 78px;
    }
    .frog-mark svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 2px rgba(0,0,0,.18)); }

    .hero-copy { position: relative; z-index: 1; }
    .game-name { margin: 0 0 6px; color: #d6f0d6; font-size: 14px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 43px); line-height: 1; letter-spacing: -.035em; }
    .hero-subtitle { margin: 9px 0 0; color: #e5f1e4; font-size: 15px; }

    .track-line {
      position: absolute;
      right: -30px;
      bottom: 20px;
      width: 270px;
      height: 17px;
      opacity: .85;
      background: var(--road);
      border-radius: 999px 0 0 999px;
    }
    .track-line::after {
      position: absolute;
      top: 4px;
      left: 72px;
      width: 9px;
      height: 9px;
      content: "";
      background: var(--pink);
      border-radius: 50%;
      box-shadow: 36px 0 0 rgba(255,255,255,.72), 72px 0 0 rgba(255,255,255,.72);
    }

    .board {
      margin-top: 18px;
      padding: 25px clamp(16px, 4vw, 34px) 30px;
      background: var(--paper);
      border: 1px solid rgba(18,58,31,.12);
      border-radius: 12px 12px 24px 24px;
      box-shadow: 0 18px 38px rgba(10,42,22,.2);
    }

    .board-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 19px;
    }
    .board-heading h2 { margin: 0; font-size: 25px; letter-spacing: -.02em; }
    .board-heading p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }

    .refresh {
      padding: 10px 15px;
      color: white;
      background: var(--leaf);
      border: 0;
      border-radius: 10px;
      box-shadow: 0 3px 0 var(--deep-grass);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .refresh:hover { background: #287640; }
    .refresh:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--deep-grass); }

    table { width: 100%; border-collapse: separate; border-spacing: 0 7px; table-layout: fixed; }
    th { padding: 0 14px 5px; color: #718175; font-size: 11px; letter-spacing: .12em; text-align: left; text-transform: uppercase; }
    th:first-child { width: 82px; }
    th:last-child { width: 175px; text-align: right; }
    td {
      height: 47px;
      padding: 9px 14px;
      background: var(--white);
      border-top: 1px solid #e5e9dc;
      border-bottom: 1px solid #e5e9dc;
      font-size: 16px;
    }
    td:first-child { border-left: 1px solid #e5e9dc; border-radius: 11px 0 0 11px; }
    td:last-child { border-right: 1px solid #e5e9dc; border-radius: 0 11px 11px 0; text-align: right; }
    .rank { color: #728174; font-weight: 800; }
    .username { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .score { color: var(--deep-grass); font-variant-numeric: tabular-nums; font-weight: 800; }
    tr.gold td { background: #fff5cf; border-color: #f2dfa0; }
    tr.silver td { background: #eff2ef; border-color: #dce2dc; }
    tr.bronze td { background: #f8e9dc; border-color: #edd3bf; }
    tr.gold .rank { color: #ad7915; }
    tr.silver .rank { color: #65736a; }
    tr.bronze .rank { color: #a45b2d; }

    .status { min-height: 19px; margin: 13px 2px 0; color: var(--muted); font-size: 13px; }
    .footer { padding: 17px 0 0; color: rgba(255,255,255,.8); font-size: 12px; text-align: center; }
    .footer a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 520px) {
      body { padding: 16px 10px; }
      .hero { min-height: 116px; padding: 20px 17px; gap: 13px; }
      .frog-mark { flex-basis: 68px; width: 68px; height: 64px; }
      .board { padding: 20px 12px 22px; }
      .board-heading h2 { font-size: 21px; }
      .board-heading p { max-width: 190px; line-height: 1.35; }
      .refresh { padding: 9px 10px; font-size: 12px; }
      th:first-child { width: 55px; }
      th:last-child { width: 105px; }
      th, td { padding-right: 9px; padding-left: 9px; }
      td { height: 44px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="frog-mark" aria-hidden="true">
        <svg viewBox="0 0 160 140" role="img" aria-label="Mama Frog wearing a crown">
          <g fill="#22b34b">
            <path d="M34 77C21 73 12 81 11 92c-1 9 6 16 14 15 3 13 14 14 19 5l5-21-15-14Z"/>
            <path d="M126 76c14-5 23 3 24 15 1 9-5 16-14 16-3 13-14 14-19 5l-5-21 14-15Z"/>
            <path d="M46 91c-7 10-7 26-3 35 3 8 12 8 15 0l8-28-20-7Z"/>
            <path d="M114 91c7 10 7 26 3 35-3 8-12 8-15 0l-8-28 20-7Z"/>
            <ellipse cx="80" cy="79" rx="61" ry="37"/>
            <path d="M28 71c-7-8-10-19-6-26 4-7 11-8 17-3l14 14-25 15Zm104 0c7-8 10-19 6-26-4-7-11-8-17-3l-14 14 25 15Z"/>
          </g>
          <path d="M25 35V15c0-6 4-10 10-10s10 4 10 10v10h20V13c0-6 4-10 10-10s10 4 10 10v12h20V15c0-6 4-10 10-10s10 4 10 10v10h10v10c0 7-5 11-12 13-31 8-66 8-97 0-7-2-11-6-11-13V35Z" fill="#ffea00"/>
          <ellipse cx="59" cy="58" rx="23" ry="17" fill="#fff"/>
          <ellipse cx="101" cy="58" rx="23" ry="17" fill="#fff"/>
          <ellipse cx="61" cy="59" rx="9" ry="10" fill="#080b09"/>
          <ellipse cx="103" cy="59" rx="9" ry="10" fill="#080b09"/>
          <path d="M48 78c12-8 52-8 64 0-9 5-19 6-27 6v21c0 9-9 13-12 3l-3-24c-8 0-15-1-22-6Z" fill="#c04ca0"/>
        </svg>
      </div>
      <div class="hero-copy">
        <p class="game-name">Vardes Tower Defense</p>
        <h1>Leaderboard</h1>
        <p class="hero-subtitle">The best scores from the pond</p>
      </div>
      <div class="track-line" aria-hidden="true"></div>
    </header>

    <section class="board" aria-labelledby="board-title">
      <div class="board-heading">
        <div>
          <h2 id="board-title">Top 10 players</h2>
          <p>Climb the ranks and claim your place.</p>
        </div>
        <button class="refresh" id="refresh" type="button">Refresh scores</button>
      </div>

      <table>
        <thead>
          <tr><th>Place</th><th>Username</th><th>Score</th></tr>
        </thead>
        <tbody id="score-rows"></tbody>
      </table>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
    <footer class="footer">Vardes Tower Defense · <a href="/admin">Admin</a></footer>
  </main>

  <script>
    const rows = document.getElementById("score-rows");
    const statusText = document.getElementById("status");

    // LEADERBOARD ROWS: render exactly ten places and leave unused places blank.
    function renderScores(scores) {
      rows.replaceChildren();
      for (let index = 0; index < 10; index += 1) {
        const entry = scores[index] || {};
        const row = document.createElement("tr");
        if (index < 3 && entry.username) {
          row.classList.add(["gold", "silver", "bronze"][index]);
        }

        const place = document.createElement("td");
        place.className = "rank";
        place.textContent = `${index + 1}.`;

        const username = document.createElement("td");
        username.className = "username";
        username.textContent = entry.username || "";

        const score = document.createElement("td");
        score.className = "score";
        score.textContent = entry.score == null ? "" : Number(entry.score).toLocaleString();

        row.append(place, username, score);
        rows.append(row);
      }
    }

    // SCORE REFRESH: request the public top ten and show a readable load error.
    async function loadScores() {
      statusText.textContent = "";
      try {
        const response = await fetch("/scores/top", { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load scores");
        const scores = await response.json();
        renderScores(Array.isArray(scores) ? scores : []);
      } catch (_error) {
        renderScores([]);
        statusText.textContent = "Scores could not be loaded. Check that the server is running, then refresh.";
      }
    }

    // REFRESH BUTTON: reload the latest leaderboard values.
    document.getElementById("refresh").addEventListener("click", loadScores);
    renderScores([]);
    loadScores();
  </script>
</body>
</html>
